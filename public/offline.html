<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#08233F" />
    <title>Driver Hub — You are offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
             background: #f8fafc; color: #0f172a; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      main { max-width: 340px; padding: 32px 16px; text-align: center; }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { font-size: 20px; margin: 20px 0 8px; color: #08233F; }
      p { font-size: 14px; line-height: 1.5; margin: 0 0 6px; color: #475569; }
      button { margin-top: 20px; min-height: 44px; padding: 0 24px; border: 0; border-radius: 12px;
               background: #08233F; color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo-192.png" alt="Driver Hub" />
      <h1>You are offline</h1>
      <p>Check your internet connection and try again.</p>
      <p lang="kn">ಇಂಟರ್ನೆಟ್ ಸಂಪರ್ಕ ಇಲ್ಲ. ಸಂಪರ್ಕ ಪರಿಶೀಲಿಸಿ ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ.</p>
      <button type="button" onclick="location.reload()">Try again / ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ</button>
    </main>
  </body>
</html>
